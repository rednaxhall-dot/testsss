        <!-- Music Player Dock (Floating at bottom center) -->

                <!-- Center: Track details and Progress Bar -->

    <audio id="card-audio" loop preload="auto" src="assets/bg-music.mp3"></audio>

    <!-- Vanilla Tilt for 3D card tilt -->
    <script src="./assets/23b6c42b86-vanilla-tilt.min.js"></script>
    <script>
        // Init 3D Tilt on the ENTIRE wrapper so card + music dock tilt together as one unit
        if (!window.matchMedia('(pointer: coarse)').matches) {
            VanillaTilt.init(document.querySelector(".profile-layout-wrapper"), {
                max: 5,
                speed: 1200,
                glare: false   /* Disabled - was causing white flashes on sides */
            });
        }

        // Click-to-Enter Overlay Logic
        const overlay = document.getElementById('click-to-enter-overlay');
        function dismissOverlay() {
            if (!overlay || overlay.classList.contains('cte-dismissed')) return;
            overlay.classList.add('cte-dismissed');
            setTimeout(() => overlay.remove(), 800);
        }
        if (overlay) {
            overlay.addEventListener('click', dismissOverlay);
            document.addEventListener('keydown', dismissOverlay, { once: true });
        }

        // Particle Background Logic

        const canvas = document.getElementById('particle-canvas');
        if (canvas) {
            const isMobile = window.innerWidth <= 768 || window.matchMedia('(pointer: coarse)').matches;
            if (isMobile) {
                canvas.style.display = 'none';
            } else {
                const ctx = canvas.getContext('2d');
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;

                window.addEventListener('resize', () => {
                    canvas.width = window.innerWidth;
                    canvas.height = window.innerHeight;
                });

                let particles = [];
                for (let i = 0; i < 35; i++) {
                    particles.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height,
                        size: Math.random() * 1.5 + 0.5,
                        speedX: Math.random() * 0.3 - 0.15,
                        speedY: Math.random() * 0.3 - 0.15,
                        color: 'rgba(255, 255, 255, 0.15)'
                    });
                }

                function animate() {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    particles.forEach(p => {
                        p.x += p.speedX;
                        p.y += p.speedY;
                        if (p.x < 0 || p.x > canvas.width) p.speedX *= -1;
                        if (p.y < 0 || p.y > canvas.height) p.speedY *= -1;

                        ctx.fillStyle = p.color;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                        ctx.fill();
                    });
                    requestAnimationFrame(animate);
                }
                animate();
            }
        }

        const audio = document.getElementById('card-audio');
        const playBtn = document.getElementById('dock-play-btn');
        const prevBtn = document.getElementById('dock-prev-btn');
        const nextBtn = document.getElementById('dock-next-btn');
        const trackTitle = document.getElementById('dock-track-title');
        const timeElapsed = document.getElementById('dock-time-elapsed');
        const timeTotal = document.getElementById('dock-time-total');
        const progressBar = document.getElementById('dock-progress-bar');
        const progressFill = document.getElementById('dock-progress-fill');
        const trackName = 'Die Young';

        function formatTime(seconds) {
            if (isNaN(seconds)) return "0:00";
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        function setTrackInfo() {
            trackTitle.textContent = trackName;
            progressFill.style.width = '0%';
            timeElapsed.textContent = '0:00';
            timeTotal.textContent = '0:00';
        }

        let playbackStarted = false;

        function playTrack() {
            if (!audio) return;
            const playPromise = audio.play();
            if (playPromise) {
                playPromise.then(() => {
                    playbackStarted = true;
                    playBtn.innerHTML = '<i class="fas fa-pause"></i>';
                }).catch(err => console.log('Audio playback failed or blocked:', err));
            }
        }

        function pauseTrack() {
            if (!audio) return;
            audio.pause();
            playBtn.innerHTML = '<i class="fas fa-play"></i>';
        }

        setTrackInfo();

        const triggerAutoplay = () => {
            if (playbackStarted || !audio || !audio.paused) return;
            playTrack();
        };

        document.addEventListener('click', triggerAutoplay, { once: true });
        document.addEventListener('pointerdown', triggerAutoplay, { once: true });
        document.addEventListener('keydown', triggerAutoplay, { once: true });
        document.addEventListener('mousemove', triggerAutoplay, { once: true });
        document.addEventListener('scroll', triggerAutoplay, { once: true });
        document.addEventListener('wheel', triggerAutoplay, { once: true });
        document.addEventListener('touchstart', triggerAutoplay, { once: true });
        document.addEventListener('touchmove', triggerAutoplay, { once: true });

        playBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (audio.paused) {
                playTrack();
            } else {
                pauseTrack();
            }
        });

        prevBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            audio.currentTime = 0;
            playTrack();
        });

        nextBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            audio.currentTime = 0;
            playTrack();
        });

        // Volume Controller Logic
        const volumeSlider = document.getElementById('dock-volume-slider');
        const volumeBtn = document.getElementById('dock-volume-btn');
        let lastVolume = 0.8;

        // Set initial sound volume
        audio.volume = 0.8;

        if (volumeSlider && volumeBtn) {
            volumeSlider.addEventListener('input', (e) => {
                const vol = parseFloat(e.target.value);
                audio.volume = vol;
                if (vol === 0) {
                    volumeBtn.innerHTML = '<i class="fas fa-volume-xmark"></i>';
                } else if (vol < 0.5) {
                    volumeBtn.innerHTML = '<i class="fas fa-volume-low"></i>';
                } else {
                    volumeBtn.innerHTML = '<i class="fas fa-volume-high"></i>';
                }
            });

            volumeBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                if (audio.volume > 0) {
                    lastVolume = audio.volume;
                    audio.volume = 0;
                    volumeSlider.value = 0;
                    volumeBtn.innerHTML = '<i class="fas fa-volume-xmark"></i>';
                } else {
                    audio.volume = lastVolume;
                    volumeSlider.value = lastVolume;
                    if (lastVolume < 0.5) {
                        volumeBtn.innerHTML = '<i class="fas fa-volume-low"></i>';
                    } else {
                        volumeBtn.innerHTML = '<i class="fas fa-volume-high"></i>';
                    }
                }
            });
        }

        // Update progress bar and time stamps
        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                const percentage = (audio.currentTime / audio.duration) * 100;
                progressFill.style.width = `${percentage}%`;
                timeElapsed.textContent = formatTime(audio.currentTime);
                timeTotal.textContent = formatTime(audio.duration);
            }
        });

        // Click on progress bar to seek
        progressBar.addEventListener('click', (e) => {
            e.stopPropagation();
            const rect = progressBar.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const width = rect.width;
            if (audio.duration && width > 0) {
                const newTime = (clickX / width) * audio.duration;
                audio.currentTime = newTime;
            }
        });

        // Auto play next track when current ends
        audio.addEventListener('ended', () => {
            currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
            loadTrack(currentTrackIndex);
            playTrack();
        });

    </script>

<script>
(function(){
  function removeLoaders(){
    var selectors=["#loading","#loader",".loading",".loader",".preloader",".pre-loader",".page-loader",".loading-screen",".loading-overlay","[class*="loading-screen"]","[class*="preloader"]","[id*="loader"]"];
    selectors.forEach(function(sel){try{document.querySelectorAll(sel).forEach(function(el){el.style.setProperty("display","none","important");el.style.setProperty("visibility","hidden","important");el.setAttribute("aria-hidden","true");});}catch(e){}});
    document.documentElement.classList.remove("loading","is-loading","page-loading","preloading");
    if(document.body) document.body.classList.remove("loading","is-loading","page-loading","preloading");
  }
  window.addEventListener("load",function(){removeLoaders();setTimeout(removeLoaders,800);setTimeout(removeLoaders,2500);});
  setTimeout(removeLoaders,5000);
})();
</script>
